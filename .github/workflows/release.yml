name: Create Release
run-name: ${{ github.event.inputs.dryrun == 'true' && 'Release (dryrun)' || (github.event.inputs.version && format('Release v{0}', github.event.inputs.version) || format('Release {0}', github.ref_name)) }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g. 1.0.0)'
        required: true
        type: string
      dryrun:
        description: 'Dry Run (no release creation, only build and artifacts)'
        required: false
        default: 'false'
        type: boolean

permissions: {}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.date.outputs.date }}
      epoch: ${{ steps.date.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/validate-release-ref.sh
      - name: Validate version format and check if greater than latest
        id: version
        env:
          DRY_RUN: ${{ inputs.dryrun }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Function to compare two semver versions
          # Returns: 1 if version1 > version2, 0 if equal, -1 if version1 < version2
          compare_versions() {
            local v1="$1"
            local v2="$2"

            IFS='.' read -r v1_major v1_minor v1_patch <<< "$v1"
            IFS='.' read -r v2_major v2_minor v2_patch <<< "$v2"

            # Convert to integers with proper base 10
            v1_major=$((10#$v1_major))
            v1_minor=$((10#$v1_minor))
            v1_patch=$((10#$v1_patch))
            v2_major=$((10#$v2_major))
            v2_minor=$((10#$v2_minor))
            v2_patch=$((10#$v2_patch))

            if [ "$v1_major" -gt "$v2_major" ] || \
               ([ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -gt "$v2_minor" ]) || \
               ([ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -eq "$v2_minor" ] && [ "$v1_patch" -gt "$v2_patch" ]); then
              echo "1"
            elif [ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -eq "$v2_minor" ] && [ "$v1_patch" -eq "$v2_patch" ]; then
              echo "0"
            else
              echo "-1"
            fi
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            new_version="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            new_version="${REF_NAME#v}"
          else
            echo "Error: Release tag must start with v"
            exit 1
          fi

          # Validate version format
          if [[ ! "$new_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Error: Version must be in format X.Y.Z without leading zeros (e.g. 1.0.0)"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            latest_version="0.0.0"

            # Find the latest version by comparing all tags
            while IFS= read -r tag; do
              if [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                version=${tag#v}
                if [[ "$(compare_versions "$version" "$latest_version")" == "1" ]]; then
                  latest_version="$version"
                fi
              fi
            done < <(git tag --list)

            # Compare new version with latest version
            comparison_result=$(compare_versions "$new_version" "$latest_version")
            if [[ "$comparison_result" != "1" ]]; then
              echo "Error: New version ($new_version) must be greater than latest version ($latest_version)"
              exit 1
            fi
          fi

          printf 'version=v%s\n' "$new_version" >> "$GITHUB_OUTPUT"
      # Use the commit time instead of the current time, so rebuilding the
      # same commit produces identical binaries and images.
      - name: Determine build date
        id: date
        run: |
          epoch="$(git log -1 --format=%ct)"
          printf 'epoch=%s\n' "$epoch" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
  run-tests:
    name: Run All Tests
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build-darwin:
    name: Build Darwin Binaries
    needs:
      - validate-version
      - run-tests
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          BINARY_NAME: pithos-${{ matrix.os }}-${{ matrix.arch }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ needs.validate-version.outputs.date }}
        run: |
          ldflags="-linkmode external -s -w -extldflags=-static-pie -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false -X github.com/jdillenkofer/pithos/internal/buildinfo.date=${DATE}"
          go build -trimpath -ldflags="$ldflags" -buildmode=pie -o "$BINARY_NAME" ./cmd
          bash .github/scripts/write-build-info.sh "$BINARY_NAME" "build-info-${BINARY_NAME}.txt" "$ldflags"
      - name: Upload Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pithos-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            pithos-${{ matrix.os }}-${{ matrix.arch }}
            build-info-pithos-${{ matrix.os }}-${{ matrix.arch }}.txt

  build-windows-amd64:
    name: Build Windows AMD64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod
      - name: Build Binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ needs.validate-version.outputs.date }}
        shell: bash
        run: |
          ldflags="-s -w -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false -X github.com/jdillenkofer/pithos/internal/buildinfo.date=${DATE}"
          go build -trimpath -ldflags="$ldflags" -o pithos-windows-amd64.exe ./cmd
          bash .github/scripts/write-build-info.sh pithos-windows-amd64.exe build-info-pithos-windows-amd64.txt "$ldflags"
      - name: Upload Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pithos-windows-amd64
          path: |
            pithos-windows-amd64.exe
            build-info-pithos-windows-amd64.txt

  build-windows-arm64:
    name: Build Windows ARM64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: ubuntu-24.04-arm  # Use Linux ARM64 runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod
      # Install outside the checkout: untracked files would make Go embed
      # vcs.modified=true and change the binary.
      - name: Install Zig
        working-directory: ${{ runner.temp }}
        run: |
          wget https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
          echo "9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8  zig-aarch64-linux-0.17.0.tar.xz" | sha256sum --check
          tar -xf zig-aarch64-linux-0.17.0.tar.xz
          echo "$(pwd)/zig-aarch64-linux-0.17.0" >> $GITHUB_PATH
      - name: Build Binary
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: zig cc -target aarch64-windows-gnu
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ needs.validate-version.outputs.date }}
        run: |
          ldflags="-s -w -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false -X github.com/jdillenkofer/pithos/internal/buildinfo.date=${DATE}"
          go build -trimpath -ldflags="$ldflags" -o pithos-windows-arm64.exe ./cmd
          bash .github/scripts/write-build-info.sh pithos-windows-arm64.exe build-info-pithos-windows-arm64.txt "$ldflags"
      - name: Upload Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pithos-windows-arm64
          path: |
            pithos-windows-arm64.exe
            build-info-pithos-windows-arm64.txt

  build-docker:
    name: Build Docker Image (${{ matrix.platform }})
    needs:
      - validate-version
      - run-tests
    # The Dockerfile cross-compiles against each target's musl, so no platform
    # is emulated and every platform builds on the same runner type.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
          - platform: linux/arm/v7
            slug: linux-armv7
          - platform: linux/riscv64
            slug: linux-riscv64
          - platform: linux/ppc64le
            slug: linux-ppc64le
          - platform: linux/s390x
            slug: linux-s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build Docker Image (no registry credentials)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Image config and history timestamps use the commit time.
          SOURCE_DATE_EPOCH: ${{ needs.validate-version.outputs.epoch }}
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # rewrite-timestamp clamps file times in the layers to
          # SOURCE_DATE_EPOCH, so the layers are reproducible as well.
          outputs: type=oci,dest=${{ runner.temp }}/pithos-image.tar,rewrite-timestamp=true
          provenance: mode=min
          # Registry tags are applied only by the publication job.
          tags: pithos:${{ needs.validate-version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SKIP_TESTS=true
            VERSION=${{ needs.validate-version.outputs.version }}
            COMMIT=${{ github.sha }}
            DIRTY=false
            DATE=${{ needs.validate-version.outputs.date }}
      - name: Validate built image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Error: Unexpected image digest format"
            exit 1
          fi
      # The per-platform digests are the reproducible ones; the multi-arch
      # digest also covers the provenance attestations and their timestamps.
      - name: Record build environment
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          SOURCE_DATE_EPOCH: ${{ needs.validate-version.outputs.epoch }}
        run: |
          {
            printf '== docker image %s\n' "$PLATFORM"
            printf 'runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'source date epoch: %s\n' "$SOURCE_DATE_EPOCH"
            docker buildx version
            docker buildx inspect | grep -E '^(Driver|BuildKit version):'
            grep -E '^FROM ' Dockerfile
            printf 'single-platform OCI index digest: %s\n' "$DIGEST"
            # Include image and provenance descriptors without a registry read.
            tar -xOf "${RUNNER_TEMP}/pithos-image.tar" "blobs/sha256/${DIGEST#sha256:}" | jq .
            printf '\n'
          } > "build-info-docker-image-${SLUG}.txt"
        shell: bash
      - name: Upload build environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-docker-image-${{ matrix.slug }}
          path: build-info-docker-image-${{ matrix.slug }}.txt
      - name: Upload OCI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-oci-platform-${{ matrix.slug }}
          path: ${{ runner.temp }}/pithos-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      # Reuses the image build's cached builder stage.
      - name: Export Linux release binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate-version.outputs.epoch }}
        with:
          context: .
          file: Dockerfile
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=${{ runner.temp }}/binary
          provenance: false
          build-args: |
            SKIP_TESTS=true
            VERSION=${{ needs.validate-version.outputs.version }}
            COMMIT=${{ github.sha }}
            DIRTY=false
            DATE=${{ needs.validate-version.outputs.date }}
      - name: Record binary build environment
        env:
          BINARY_NAME: pithos-${{ matrix.slug }}
          SOURCE_DATE_EPOCH: ${{ needs.validate-version.outputs.epoch }}
        run: |
          mv "${RUNNER_TEMP}/binary/pithos" "$BINARY_NAME"
          {
            printf '== %s\n' "$BINARY_NAME"
            printf 'runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'source date epoch: %s\n' "$SOURCE_DATE_EPOCH"
            docker buildx version
            grep -E '^FROM ' Dockerfile
            cat "${RUNNER_TEMP}/binary/build-info.txt"
            printf '\n'
          } > "build-info-${BINARY_NAME}.txt"
      - name: Upload Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pithos-${{ matrix.slug }}
          path: |
            pithos-${{ matrix.slug }}
            build-info-pithos-${{ matrix.slug }}.txt
          if-no-files-found: error

  merge-docker:
    name: Merge Multi-Arch OCI Archive
    needs: [validate-version, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download platform OCI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-oci-platform-*
          path: ${{ runner.temp }}/platforms
      - name: Merge into one multi-platform image index
        id: merge
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          # One named index in the archive keeps OCI source selection unambiguous.
          digest="$(bash .github/scripts/merge-oci-archives.sh \
            "${RUNNER_TEMP}/pithos-image.tar" "$VERSION" \
            "${RUNNER_TEMP}"/platforms/docker-oci-platform-*/pithos-image.tar)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Error: Unexpected image digest format"
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf '== docker image index\n'
            printf 'multi-arch OCI digest: %s\n' "$digest"
            tar -xOf "${RUNNER_TEMP}/pithos-image.tar" "blobs/sha256/${digest#sha256:}" | jq .
            printf '\n'
          } > build-info-docker-image-index.txt
      - name: Upload index information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-docker-image-index
          path: build-info-docker-image-index.txt
      - name: Upload OCI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-oci-archive
          path: ${{ runner.temp }}/pithos-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-docker:
    name: Publish and Sign Multi-Arch Image (no build)
    needs: [validate-version, merge-docker]
    if: >-
      github.event.inputs.dryrun != 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      # No checkout and no project code execution in this privileged job.
      - name: Download OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-oci-archive
          path: ${{ runner.temp }}/image
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: jdillenkofer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact OCI index and all its manifests
        env:
          DIGEST: ${{ needs.merge-docker.outputs.digest }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          # Skopeo 1.18.0, pinned multi-platform image index.
          SKOPEO: quay.io/skopeo/stable@sha256:c4c8a9d6fc95e331fa92fc31de3f6c9b5fe4761c82f0acb99669eef067fb7c33
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          skopeo() {
            docker run --rm --network host \
              --volume "${RUNNER_TEMP}/image:/image:ro" \
              --volume "${HOME}/.docker/config.json:/auth.json:ro" \
              "$SKOPEO" "$@"
          }
          # Inspect the selected index, not the OCI layout's outer index.json.
          skopeo inspect --raw oci-archive:/image/pithos-image.tar > source-index.json
          actual="sha256:$(sha256sum source-index.json | cut -d ' ' -f 1)"
          [[ "$actual" == "$DIGEST" ]]
          for image in docker.io/jdillenkofer/pithos ghcr.io/jdillenkofer/pithos; do
            for tag in "$VERSION" latest; do
              # --all includes both architectures AND BuildKit provenance.
              # --preserve-digests fails rather than converting manifest formats.
              skopeo copy --all --preserve-digests --authfile /auth.json \
                oci-archive:/image/pithos-image.tar "docker://${image}:${tag}"
              skopeo inspect --raw --authfile /auth.json "docker://${image}:${tag}" > published-index.json
              actual="sha256:$(sha256sum published-index.json | cut -d ' ' -f 1)"
              [[ "$actual" == "$DIGEST" ]]
            done
          done
      - name: Install Cosign
        # Cosign v2 uses the legacy signature tags supported by Docker Hub.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'
      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/jdillenkofer/pithos
          subject-digest: ${{ needs.merge-docker.outputs.digest }}
          push-to-registry: true
          # Artifact metadata storage records are only available to
          # organization-owned repositories; the attestation is still stored
          # with the repository and pushed to GHCR.
          create-storage-record: false
      - name: Sign and verify the published Docker images
        env:
          DIGEST: ${{ needs.merge-docker.outputs.digest }}
        run: |
          # Sign by immutable digest rather than mutable tags. Both tags
          # (vX.Y.Z and latest) resolve to this single multi-arch digest, so
          # one signature covers them at each registry. Each registry needs its
          # own signature attachment.
          #
          # Cosign v2 (pinned above) writes the signature as a legacy
          # sha256-<digest>.sig tag, which Docker Hub's Referrers API serves
          # correctly so `cosign verify` can discover it.
          for image in "docker.io/jdillenkofer/pithos" "ghcr.io/jdillenkofer/pithos"; do
            cosign sign --yes "${image}@${DIGEST}"
            # Verify the signature we just produced before publishing the
            # release, asserting it was issued to this repo's release workflow
            # via keyless OIDC (Fulcio identity + GitHub Actions issuer).
            cosign verify \
              --certificate-identity-regexp '^https://github.com/jdillenkofer/pithos/\.github/workflows/release\.yml@.*$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${image}@${DIGEST}"
          done

  release:
    name: Create Release
    needs: [validate-version, build-docker, build-darwin, build-windows-amd64, build-windows-arm64, publish-docker]
    if: >-
      github.event.inputs.dryrun != 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Required to create the tag and GitHub release
      id-token: write # Needed for keyless signing with Cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - name: Install git-cliff
        env:
          GIT_CLIFF_SHA256: 9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546
          GIT_CLIFF_VERSION: '2.13.1'
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/git-cliff-${GIT_CLIFF_VERSION}"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --output "$archive_path" \
            "$url"

          printf '%s  %s\n' "$GIT_CLIFF_SHA256" "$archive_path" |
            sha256sum --check --strict

          mkdir -p "$install_dir"
          tar \
            --extract \
            --file "$archive_path" \
            --gzip \
            --directory "$install_dir" \
            --strip-components 1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

          "$install_dir/git-cliff" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pithos-*
          path: binaries
      - name: Download image build information
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-info-docker-image-*
          path: binaries
      - name: Prepare Artifacts and Sign
        run: |
          mkdir -p dist
          cp binaries/pithos-linux-amd64/pithos-linux-amd64 dist/
          cp binaries/pithos-linux-arm64/pithos-linux-arm64 dist/
          cp binaries/pithos-linux-armv7/pithos-linux-armv7 dist/
          cp binaries/pithos-linux-riscv64/pithos-linux-riscv64 dist/
          cp binaries/pithos-linux-ppc64le/pithos-linux-ppc64le dist/
          cp binaries/pithos-linux-s390x/pithos-linux-s390x dist/
          cp binaries/pithos-darwin-amd64/pithos-darwin-amd64 dist/
          cp binaries/pithos-darwin-arm64/pithos-darwin-arm64 dist/
          cp binaries/pithos-windows-amd64/pithos-windows-amd64.exe dist/
          cp binaries/pithos-windows-arm64/pithos-windows-arm64.exe dist/
          # Created before checksums.txt, so the signature covers it.
          cat binaries/*/build-info-*.txt > dist/build-info.txt
          
          cd dist
          sha256sum * > checksums.txt
          
          # Sign the checksums file, writing a single Sigstore bundle
          # (signature + Fulcio certificate + Rekor entry) in the protobuf
          # bundle format that is the default in Cosign v3.
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            checksums.txt

          # Verify the bundle before publishing so a broken signature fails
          # the release instead of shipping unverifiable artifacts.
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp '^https://github.com/jdillenkofer/pithos/\.github/workflows/release\.yml@.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt
      - name: Generate Release Notes
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          previous_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" != "$VERSION" ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..HEAD"
          else
            commit_range="HEAD"
          fi

          git-cliff \
            --config cliff.toml \
            --no-exec \
            --offline \
            --output RELEASE_NOTES.md \
            --tag "$VERSION" \
            "$commit_range"

          if [[ -n "$previous_tag" ]]; then
            printf '\n[Full Changelog](https://github.com/jdillenkofer/pithos/compare/%s...%s)\n' \
              "$previous_tag" "$VERSION" >> RELEASE_NOTES.md
          fi
      - name: Create Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field "ref=refs/tags/${VERSION}" \
            --field "sha=${COMMIT}"
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.validate-version.outputs.version }}
          tag_name: ${{ needs.validate-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*
