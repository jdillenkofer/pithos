name: Create Release
run-name: ${{ github.event.inputs.dryrun == 'true' && 'Release (dryrun)' || (github.event.inputs.version && format('Release v{0}', github.event.inputs.version) || format('Release {0}', github.ref_name)) }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g. 1.0.0)'
        required: true
        type: string
      dryrun:
        description: 'Dry Run (no release creation, only build and artifacts)'
        required: false
        default: 'false'
        type: boolean

permissions: {}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version format and check if greater than latest
        id: version
        env:
          DRY_RUN: ${{ inputs.dryrun }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Function to compare two semver versions
          # Returns: 1 if version1 > version2, 0 if equal, -1 if version1 < version2
          compare_versions() {
            local v1="$1"
            local v2="$2"

            IFS='.' read -r v1_major v1_minor v1_patch <<< "$v1"
            IFS='.' read -r v2_major v2_minor v2_patch <<< "$v2"

            # Convert to integers with proper base 10
            v1_major=$((10#$v1_major))
            v1_minor=$((10#$v1_minor))
            v1_patch=$((10#$v1_patch))
            v2_major=$((10#$v2_major))
            v2_minor=$((10#$v2_minor))
            v2_patch=$((10#$v2_patch))

            if [ "$v1_major" -gt "$v2_major" ] || \
               ([ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -gt "$v2_minor" ]) || \
               ([ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -eq "$v2_minor" ] && [ "$v1_patch" -gt "$v2_patch" ]); then
              echo "1"
            elif [ "$v1_major" -eq "$v2_major" ] && [ "$v1_minor" -eq "$v2_minor" ] && [ "$v1_patch" -eq "$v2_patch" ]; then
              echo "0"
            else
              echo "-1"
            fi
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            new_version="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            new_version="${REF_NAME#v}"
          else
            echo "Error: Release tag must start with v"
            exit 1
          fi

          # Validate version format
          if [[ ! "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g. 1.0.0)"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            latest_version="0.0.0"

            # Find the latest version by comparing all tags
            while IFS= read -r tag; do
              if [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                version=${tag#v}
                if [[ "$(compare_versions "$version" "$latest_version")" == "1" ]]; then
                  latest_version="$version"
                fi
              fi
            done < <(git tag --list)

            # Compare new version with latest version
            comparison_result=$(compare_versions "$new_version" "$latest_version")
            if [[ "$comparison_result" != "1" ]]; then
              echo "Error: New version ($new_version) must be greater than latest version ($latest_version)"
              exit 1
            fi
          fi

          printf 'version=v%s\n' "$new_version" >> "$GITHUB_OUTPUT"
  run-tests:
    name: Run All Tests
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build-linux-amd64:
    name: Build Linux AMD64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.0'
      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags="-linkmode external -s -w -extldflags=-static-pie -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false" -buildmode=pie -o pithos-linux-amd64 ./cmd
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pithos-linux-amd64
          path: pithos-linux-amd64

  build-linux-arm64:
    name: Build Linux ARM64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.0'
      - name: Install Cross-Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags="-linkmode external -s -w -extldflags=-static-pie -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false" -buildmode=pie -o pithos-linux-arm64 ./cmd
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pithos-linux-arm64
          path: pithos-linux-arm64

  build-darwin:
    name: Build Darwin Binaries
    needs:
      - validate-version
      - run-tests
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.0'
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          BINARY_NAME: pithos-${{ matrix.os }}-${{ matrix.arch }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags="-linkmode external -s -w -extldflags=-static-pie -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false" -buildmode=pie -o "$BINARY_NAME" ./cmd
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pithos-${{ matrix.os }}-${{ matrix.arch }}
          path: pithos-${{ matrix.os }}-${{ matrix.arch }}

  build-windows-amd64:
    name: Build Windows AMD64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.0'
      - name: Build Binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags="-s -w -X github.com/jdillenkofer/pithos/internal/buildinfo.version=$env:VERSION -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=$env:COMMIT -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false" -o pithos-windows-amd64.exe ./cmd
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pithos-windows-amd64
          path: pithos-windows-amd64.exe

  build-windows-arm64:
    name: Build Windows ARM64 Binary
    needs:
      - validate-version
      - run-tests
    runs-on: ubuntu-24.04-arm  # Use Linux ARM64 runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.0'
      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz
          tar -xf zig-linux-aarch64-0.13.0.tar.xz
          echo "$(pwd)/zig-linux-aarch64-0.13.0" >> $GITHUB_PATH
      - name: Build Binary
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: zig cc -target aarch64-windows-gnu
          VERSION: ${{ needs.validate-version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags="-s -w -X github.com/jdillenkofer/pithos/internal/buildinfo.version=${VERSION} -X github.com/jdillenkofer/pithos/internal/buildinfo.commit=${COMMIT} -X github.com/jdillenkofer/pithos/internal/buildinfo.dirty=false" -o pithos-windows-arm64.exe ./cmd
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pithos-windows-arm64
          path: pithos-windows-arm64.exe

  build-and-push-docker:
    name: Build and Push Multi-Arch Docker Image
    needs:
      - validate-version
      - run-tests
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Required to publish GitHub provenance attestations
      contents: read
      id-token: write # Needed for keyless signing with Cosign
      packages: write # Required to publish images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Cosign
        # Pinned to Cosign v2 for Docker image signing. Cosign v3 signs through
        # a sigstore signing config that mandates the new OCI 1.1 bundle format,
        # which Docker Hub's incomplete Referrers API support hides from
        # `cosign verify` ("no signatures found"). v2 defaults to the legacy
        # sha256-<digest>.sig tag scheme that Docker Hub serves correctly.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to DockerHub
        if: github.event.inputs.dryrun != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: jdillenkofer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: github.event.inputs.dryrun != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and (optionally) Push Docker Image (multi-arch)
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dryrun != 'true' }}
          tags: |
            jdillenkofer/pithos:${{ needs.validate-version.outputs.version }}
            jdillenkofer/pithos:latest
            ghcr.io/jdillenkofer/pithos:${{ needs.validate-version.outputs.version }}
            ghcr.io/jdillenkofer/pithos:latest
          labels: |
            org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SKIP_TESTS=true
            VERSION=${{ needs.validate-version.outputs.version }}
            COMMIT=${{ github.sha }}
            DIRTY=false
      - name: Validate published image digest
        id: image
        if: ${{ github.event.inputs.dryrun != 'true' }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Error: Unexpected image digest format"
            exit 1
          fi

          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest GHCR image provenance
        if: ${{ github.event.inputs.dryrun != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/jdillenkofer/pithos
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Artifact metadata storage records are only available to
          # organization-owned repositories; the attestation is still stored
          # with the repository and pushed to GHCR.
          create-storage-record: false
      - name: Sign and verify the published Docker images
        if: ${{ github.event.inputs.dryrun != 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Sign by immutable digest rather than mutable tags. Both tags
          # (vX.Y.Z and latest) resolve to this single multi-arch digest, so
          # one signature covers them at each registry. Each registry needs its
          # own signature attachment.
          #
          # Cosign v2 (pinned above) writes the signature as a legacy
          # sha256-<digest>.sig tag, which Docker Hub's Referrers API serves
          # correctly so `cosign verify` can discover it.
          for image in "docker.io/jdillenkofer/pithos" "ghcr.io/jdillenkofer/pithos"; do
            cosign sign --yes "${image}@${DIGEST}"
            # Verify the signature we just produced before publishing the
            # release, asserting it was issued to this repo's release workflow
            # via keyless OIDC (Fulcio identity + GitHub Actions issuer).
            cosign verify \
              --certificate-identity-regexp '^https://github.com/jdillenkofer/pithos/\.github/workflows/release\.yml@.*$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${image}@${DIGEST}"
          done

  release:
    name: Create Release
    needs: [validate-version, build-linux-amd64, build-linux-arm64, build-darwin, build-windows-amd64, build-windows-arm64, build-and-push-docker]
    if: github.event.inputs.dryrun != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the tag and GitHub release
      id-token: write # Needed for keyless signing with Cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - name: Install git-cliff
        env:
          GIT_CLIFF_SHA256: 9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546
          GIT_CLIFF_VERSION: '2.13.1'
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/git-cliff-${GIT_CLIFF_VERSION}"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --output "$archive_path" \
            "$url"

          printf '%s  %s\n' "$GIT_CLIFF_SHA256" "$archive_path" |
            sha256sum --check --strict

          mkdir -p "$install_dir"
          tar \
            --extract \
            --file "$archive_path" \
            --gzip \
            --directory "$install_dir" \
            --strip-components 1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

          "$install_dir/git-cliff" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Download Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binaries
      - name: Prepare Artifacts and Sign
        run: |
          mkdir -p dist
          cp binaries/pithos-linux-amd64/pithos-linux-amd64 dist/
          cp binaries/pithos-linux-arm64/pithos-linux-arm64 dist/
          cp binaries/pithos-darwin-amd64/pithos-darwin-amd64 dist/
          cp binaries/pithos-darwin-arm64/pithos-darwin-arm64 dist/
          cp binaries/pithos-windows-amd64/pithos-windows-amd64.exe dist/
          cp binaries/pithos-windows-arm64/pithos-windows-arm64.exe dist/
          
          cd dist
          sha256sum * > checksums.txt
          
          # Sign the checksums file, writing a single Sigstore bundle
          # (signature + Fulcio certificate + Rekor entry) in the protobuf
          # bundle format that is the default in Cosign v3.
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            checksums.txt

          # Verify the bundle before publishing so a broken signature fails
          # the release instead of shipping unverifiable artifacts.
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp '^https://github.com/jdillenkofer/pithos/\.github/workflows/release\.yml@.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt
      - name: Generate Release Notes
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          previous_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" != "$VERSION" ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..HEAD"
          else
            commit_range="HEAD"
          fi

          git-cliff \
            --config cliff.toml \
            --no-exec \
            --offline \
            --output RELEASE_NOTES.md \
            --tag "$VERSION" \
            "$commit_range"

          if [[ -n "$previous_tag" ]]; then
            printf '\n[Full Changelog](https://github.com/jdillenkofer/pithos/compare/%s...%s)\n' \
              "$previous_tag" "$VERSION" >> RELEASE_NOTES.md
          fi
      - name: Create Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field "ref=refs/tags/${VERSION}" \
            --field "sha=${COMMIT}"
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.validate-version.outputs.version }}
          tag_name: ${{ needs.validate-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*
