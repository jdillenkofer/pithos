{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRF}}">
  <title>{{.Title}} · Pithos</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script defer src="/static/htmx.min.js"></script>
  <script defer src="/static/admin.js"></script>
</head>
<body hx-history="false" hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}'>
  <header>
    <a class="brand" href="/">Pithos Admin</a>
    {{if .Authenticated}}<nav aria-label="Administration">
      <a href="/">Dashboard</a>
      <a href="/buckets">Buckets</a>
      <a href="/credentials">Credentials</a>
      <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button>Log out</button></form>
    </nav>{{end}}
  </header>
  <main id="main">{{.Content}}</main>
</body>
</html>{{end}}
