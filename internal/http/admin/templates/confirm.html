{{define "confirm"}}
<div class="crumbs"><a href="/">Pithos</a><span class="sep">›</span><span>Confirm deletion</span></div>
<div class="page-head"><h1>{{.Title}}</h1></div>
<div class="alert warn"><p>{{.Message}}</p></div>
<form method="post" action="{{.Target}}">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <input type="hidden" name="confirm" value="yes">
  {{range .Fields}}<input type="hidden" name="{{.Label}}" value="{{.Value}}">{{end}}
  <div class="actions-row start"><a class="button-link" href="{{.CancelURL}}">Cancel</a><button type="submit" class="danger">{{.Action}}</button></div>
</form>
{{end}}
