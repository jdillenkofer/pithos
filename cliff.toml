# git-cliff configuration for GitHub release notes.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true
render_always = true
postprocessors = [
  { pattern = '<REPO>', replace = 'https://github.com/jdillenkofer/pithos' },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/pull/${2}))" },
]
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
  { message = "^(build|chore)\\(deps[^)]*\\)", group = "<!-- 5 -->📦 Dependencies" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->🔧 Maintenance" },
  { message = "^(test|style)", skip = true },
  { message = ".*", group = "<!-- 7 -->🧰 Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = true
topo_order_commits = true
sort_commits = "oldest"
